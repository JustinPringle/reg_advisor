# Civil Engineering (Augmented) — standalone programme definition.
#
# A complete FIVE-year programme in its own right. Level 1 is spread over two
# calendar years (Years 1-2); Levels 2-4 follow the mainstream Civil curriculum,
# copied here so this file stands alone. Where a mainstream module required a
# first-year module that has an augmented twin, the requirement is rewritten to
# accept EITHER twin (see THE AUGMENTED RULE below).
#
# Grammar is identical to civil.yaml (regadvisor_engine.eval_term). yaml.safe_load
# returns exactly the dicts and lists the engine reads; no free-text parsing.
#
# Term shapes (a module's `prereqs` is a list, AND-ed together):
#   CODE                       course passed
#   {code: X, min_mark: N}     best mark >= N carries (a 40-49 carry; no full pass)
#   {code: X, soft: true}      recommended only — never blocks
#   {all: [...]}               every term holds
#   {any: [...]}               at least one holds  <-- aug|mainstream substitution
#   {any_n: N, of: [...]}      at least N hold
#   {min_year: N}              student in year N of study or later
#   {min_sem: N}               registered for >= N semesters
#   {min_credits: N, level: L} N passed credits (optionally at NQF level L)
#   {review: "text"}           NEVER auto-clears — routes the module to a human
#
# THE AUGMENTED RULE (handbook). Each augmented module has a mainstream twin.
#   1. Passing EITHER twin satisfies a downstream prerequisite — encoded with the
#      reusable {any: [aug, main]} anchors under `_twins` below.
#   2. FAILING an augmented module obliges the student to take the mainstream
#      twin (different credits/notional hours). That enforcement is advisor logic
#      (a later step); the `equivalences` block is the data it reads.
#
# LEVEL derives from the module CODE (ENCV2SA -> 2), not the `year` field, so
# progression gates are correct regardless of year numbering. `year` is a display
# hint only; the 5-year mapping (mainstream L2->Y3, L3->Y4, L4->Y5) awaits the
# augmented Years 3-5 handbook — see OPEN DECISIONS.

programme:
  code: ENG-CIVIL-AUG
  name: Civil Engineering (Augmented)
  total_credits: 576
regulation_years: 5
external_prereqs:
  - PHYS110
# Augmented <-> mainstream twins (handbook equivalence table). Data only.
# Declared divergences from catalogue/modules.yaml. The catalogue is ITS ground
# truth and normally wins; where this programme must value a module differently,
# say so HERE with a reason rather than restating the field on the module. The
# loader applies these, and catalogue_lint reports an undeclared disagreement as
# an error rather than a shrug. Empty block = the programme agrees with ITS.
# Degree credits per year of study, AS PRINTED IN THE HANDBOOK. This is the
# arithmetic the module list below must satisfy; catalogue_lint --credits checks
# it and the loader warns when the list drifts. Y1 and Y2 are printed module by
# module in the handbook and agree with the list below. Y3-Y5 are printed as
# year totals only, so this block is the only record of them.
#   64 + 112 + 128 + 128 + 144 = 576
year_credits: {1: 64, 2: 112, 3: 128, 4: 128, 5: 144}
# Nine of the ten semesters also land on the rules.ers normal-load table below.
# The exception is Year 3: 56/72 against the template's 64/64. Civil's Level 2 is
# not eight 16cr modules -- ENCV2MT (8) sits in S1 and ENCV2FL (8) in S2, and
# ENCV2FL cannot move because it gates ENCV3FA. The year total is right; the
# split is the same generic-template deviation the handbook shows at Level 4 S2,
# where Civil runs 2x24 + 3x8 rather than 2x16 + 2x8 + 1x32.

catalogue_overrides:
  # TWO KINDS OF CREDIT. Degree credit is what counts toward the 576 needed to
  # graduate, and every ERS progression threshold is cumulative degree credit.
  # Registration load is what ITS charges for the sitting (modules.yaml, the ITS
  # 'Subj Cred' column). They agree everywhere except these four year-long
  # augmented foundation modules, which run across both semesters: ITS records
  # the full 32, the curriculum counts 16.
  #
  # Verified, not asserted: with 16 here the degree credits sum to exactly 576
  # and track the rules.ers normal-load table above. With 32 they would not.
  # Re-run the check any time this file changes:
  #   python scripts/catalogue_lint.py programmes/augmented_civil.yaml --credits
  #
  # OPEN (Justin Pringle 2026-09-14): whether the 8-credit augmented modules
  # (ENME160, ENCH160, ENAG160, ENAG161) also carry an unrecorded foundation
  # component. ITS lists them at 8, not 16, so nothing here overrides them; the
  # 576 total holds either way. Confirm against the handbook.
  - {code: MATH160, field: credits, value: 16, reason: "year-long; ITS 32 is registration load across two semesters, 16 is degree credit"}
  - {code: MATH161, field: credits, value: 16, reason: "year-long; ITS 32 is registration load across two semesters, 16 is degree credit"}
  - {code: PHYS160, field: credits, value: 16, reason: "year-long; ITS 32 is registration load across two semesters, 16 is degree credit"}
  - {code: PHYS163, field: credits, value: 16, reason: "year-long; ITS 32 is registration load across two semesters, 16 is degree credit"}

equivalences:
  - {augmented: MATH160, mainstream: MATH131}   # Eng Mathematics 1A
  - {augmented: MATH161, mainstream: MATH141}   # Eng Mathematics 1B
  - {augmented: PHYS160, mainstream: PHYS151}   # Eng Physics 1A
  - {augmented: PHYS163, mainstream: PHYS152}   # Eng Physics 1B
  - {augmented: ENME160, mainstream: ENME1DR}   # Engineering Drawing
  - {augmented: ENCH160, mainstream: ENCH1TC}   # Technical Communication
  - {augmented: ENAG161, mainstream: ENME1EM}   # Engineering Materials
  - {augmented: ENAG160, mainstream: ENCV1ED}   # Engineering Design (Civil branch)

# Reusable "either twin passed" terms (full pass of aug OR mainstream). Defined
# once, referenced by the downstream modules and the capstone gate. The current
# engine ignores unknown top-level keys, so this block only carries anchors.
_twins:
  - &TW_DRAW {any: [ENME160, ENME1DR]}   # Drawing
  - &TW_TC   {any: [ENCH160, ENCH1TC]}   # Technical Communication
  - &TW_M1A  {any: [MATH160, MATH131]}   # Mathematics 1A
  - &TW_P1A  {any: [PHYS160, PHYS151]}   # Physics 1A
  - &TW_MAT  {any: [ENAG161, ENME1EM]}   # Materials
  - &TW_DES  {any: [ENAG160, ENCV1ED]}   # Design
  - &TW_M1B  {any: [MATH161, MATH141]}   # Mathematics 1B
  - &TW_P1B  {any: [PHYS163, PHYS152]}   # Physics 1B

# Policy, as data. Inherited from mainstream Civil unchanged, pending augmented-
# specific sign-off (D1: augmented Level 1 spans four semesters, not two).
rules:
  concession:
    min_gpa: 55
    max_missing: 1
    prereq_floor: 45
  autoclear:
    enabled: true
    min_wam: 55
    carry_band: [46, 49]
    single_miss_only: true
    allowed_standings: [green, orange]
    rule_id: CAC-v1
  credit_cap:
    green: null
    orange: 48
    red: 32
    exclude: 0
    ERS-ORANGE-SEM: 56
    ERS-RED-SECOND: 24
  ers:
    # Progression thresholds by semesters completed (robot_system_logic Section 3),
    # augmented stream. Row = [min_progression, normal, p75_of_normal].
    progression:
      1:  [0,   16,  0]
      2:  [32,  64,  48]
      3:  [56,  104, 78]
      4:  [96,  176, 132]
      5:  [144, 240, 180]
      6:  [192, 304, 228]
      7:  [240, 368, 276]
      8:  [288, 432, 324]
      9:  [336, 504, null]
      10: [384, 576, null]
      11: [432, null, null]
      12: [480, null, null]
      13: [528, null, null]
      14: [576, null, null]

modules:

  # ===================================================================
  # LEVEL 1 — YEAR 1  (64 credits: Sem 1 = 16, Sem 2 = 48)
  # ===================================================================

  # ---- Year 1, Semester 1 ------------------------------------------------
  - {code: ENME160, year: 1, sem: 1}
  - {code: ENCH160, year: 1, sem: 1}

  # ---- Year 1, Semester 2 ------------------------------------------------
  # MATH160/PHYS160 are year-long; the sheet realises their credit in Semester 2.
  - {code: MATH160, year: 1, sem: 2, year_long: true}
  - {code: PHYS160, year: 1, sem: 2, year_long: true}
  - {code: ENAG161, year: 1, sem: 2}
  - code: ENAG160
    year: 1
    sem: 2
    prereqs: [*TW_DRAW]          # mainstream ENCV1ED needs Drawing; either twin

  # ===================================================================
  # LEVEL 1 — YEAR 2  (112 credits: Sem 1 = 40, Sem 2 = 72)
  # ===================================================================

  # ---- Year 2, Semester 1 ------------------------------------------------
  - {code: MATH132, year: 2, sem: 1}
  - {code: CHEM181, year: 2, sem: 1}
  # Handbook: "Level 2 Programme Specific Module" (16 cr) — a pull-forward of the
  # Level-2 Surveying module (ENSV2SE) into augmented Year 2. Named from the
  # cohort: 96 of 153 augmented students sat ENSV2SE in this slot. Removed from
  # Year 3 to avoid double-listing (see A1c). — Justin Pringle 2026-08-25
  - code: ENSV2SE
    year: 2
    sem: 1
    prereqs:
      - {min_credits: 62, level: 1}
      - {min_sem: 2}

  # ---- Year 2, Semester 2 ------------------------------------------------
  - code: MATH161
    year: 2
    sem: 2
    year_long: true
    prereqs:                     # Maths 1A carry (>=40), either twin
      - {any: [{code: MATH160, min_mark: 40}, {code: MATH131, min_mark: 40}]}
  - code: PHYS163
    year: 2
    sem: 2
    year_long: true
    prereqs:                     # Physics 1A carry (>=40), either twin
      - {any: [{code: PHYS160, min_mark: 40}, {code: PHYS151, min_mark: 40}]}
  - code: MATH142
    year: 2
    sem: 2
    prereqs:                     # mainstream: MATH131 + MATH132 carry
      - {any: [{code: MATH160, min_mark: 40}, 
              {code: MATH131, min_mark: 40}]}
      - {code: MATH132, min_mark: 40}
  - code: CHEM191
    year: 2
    sem: 2
    prereqs:
      - {code: CHEM181, min_mark: 40}
  - {code: "ZULN101_OR", name: "Basic isiZulu Language Studies (or other language)",
     credits: 16, year: 2, sem: 2, type: elective, choice: LANG_AUG}
  - {code: "ELECTIVE_AUG", name: "Elective (in place of ZULN101)",
     credits: 16, year: 2, sem: 2, type: elective, choice: LANG_AUG}
 

  # ===================================================================
  # LEVEL 2 — AUGMENTED YEAR 3  (mainstream Level 2, year hint +1)
  # Prereqs naming a twinned first-year module accept either twin.
  # ===================================================================

  # ---- Sem 1 -------------------------------------------------------------
  - code: ENCV2MT
    year: 3
    sem: 1
    prereqs: [*TW_MAT]                 # was ENME1EM
  - code: ENCV2SA
    year: 3
    sem: 1
    prereqs: [*TW_M1B, MATH142]        # was MATH141, MATH142
  # ENSV2SE (Surveying) is pulled forward to Year 2 Sem 1 (A1c) — not repeated here.
  - code: MATH238
    year: 3
    sem: 1
    prereqs: 
      - {any: [{code: MATH160, min_mark: 50}, {code: MATH131, min_mark: 50}]}
      - {any: [{code: MATH161, min_mark: 40}, {code: MATH141, min_mark: 40}]} #[*TW_M1A, *TW_M1B]        # was MATH131, MATH141
  # Handbook: Level 2 year carries 8 x 16cr programme-specific modules. Civil's
  # own Level 2 supplies only 112 of those credits once ENSV2SE moves to Year 2
  # (A1c), so one 16cr Level 3 module is pulled forward. ENCV3TT is the only
  # candidate: ENCV3G1, the other 16cr Level 3 module with no Level 3 prereq,
  # needs 32cr at Level 2 and a Year 3 augmented student has 16.
  # DECISION A1d (J. Pringle 2026-09-14): ENCV3TT sits in augmented Y3S1.
  - code: ENCV3TT
    year: 3
    sem: 1
    prereqs:
      - {min_year: 3}            # pulled forward; mainstream reads "3rd yr of study"
  
  

  # ---- Sem 2 -------------------------------------------------------------
  - code: ENCV2FL
    year: 3
    sem: 2
    prereqs:
      - MATH142
      - {any: [PHYS160, PHYS151, PHYS110]}   # Physics 1A twin, or PHYS110
  - code: ENCV2MW
    year: 3
    sem: 2
    is_dp: true
    prereqs: [ENCV2MT]
  - code: ENCV2SB
    year: 3
    sem: 2
    prereqs: [ENCV2SA]
  - code: ENCV2SD
    year: 3
    sem: 2
    prereqs: [ENCV2SA]
  - code: GEOL215
    year: 3
    sem: 2
    prereqs:
      - {min_credits: 62, level: 1}
      - {min_sem: 2}
  - code: MATH248
    year: 3
    sem: 2
    prereqs: [MATH238, *TW_M1B]         # was MATH238, MATH141

  # ===================================================================
  # LEVEL 3 — AUGMENTED YEAR 4  (mainstream Level 3, year hint +1)
  # ===================================================================

  # ---- Sem 1 -------------------------------------------------------------
  - code: ENCV3FA
    year: 4
    sem: 1
    prereqs: [ENCV2FL]
  - code: ENCV3G1
    year: 4
    sem: 1
    prereqs:
      - {min_credits: 144, level: 1}
      - {min_credits: 32, level: 2}
  - code: ENCV3ST
    year: 4
    sem: 1
    prereqs: [ENCV2SA, ENCV2SB]


  - code: STAT370
    year: 4
    sem: 1
    prereqs: [MATH248]
  - {code: "ELECTIVE_Y4S1", name: "Elective", credits: 8, year: 4, sem: 1, type: elective}

  # ---- Sem 2 -------------------------------------------------------------
  - code: ENCV3CW
    year: 4
    sem: 2
    is_dp: true
    prereqs: [ENCV3ST, ENCV2SD]
  - code: ENCV3FB
    year: 4
    sem: 2
    prereqs: [ENCV2FL, STAT370]
  - code: ENCV3G2
    year: 4
    sem: 2
    prereqs: [ENCV3G1]
  - code: ENCV3SD
    year: 4
    sem: 2
    prereqs: [ENCV2SD, ENCV3ST]
  - code: ENCV3TP
    year: 4
    sem: 2
    prereqs: [ENCV3G1, ENCV3TT, GEOL215]
  - code: ENCV3MS
    year: 4
    sem: 2
    prereqs: [MATH238, MATH248, STAT370]


  # ===================================================================
  # LEVEL 4 — AUGMENTED YEAR 5  (mainstream Level 4, year hint +1)
  # ===================================================================

  # ---- Sem 1 -------------------------------------------------------------
  - code: ENCH4ML
    year: 5
    sem: 1
    prereqs:
      - {min_credits: 144, level: 1}
      - {min_credits: 96, level: 2}
  - code: ENCV4GS
    year: 5
    sem: 1
    prereqs: [ENCV3G1, ENCV3G2, ENCV3SD, ENCV3ST]
  - code: ENCV4TE
    year: 5
    sem: 1
    prereqs: [ENCV3TT]
  - code: ENCV4WE
    year: 5
    sem: 1
    prereqs: [ENCV2FL, ENCV3FA, ENCV3FB]
  - code: ENPD7PP
    year: 5
    sem: 1
    prereqs:
      - {min_year: 5}          # mainstream min_year 4 -> +1 for the 5-year degree
  - {code: "ELECTIVE_Y5S1", name: "Elective", credits: 8, year: 5, sem: 1, type: elective}

  # ---- Sem 2 -------------------------------------------------------------
  - code: ENCV4DE
    year: 5
    sem: 2
    # "Passed all preceding core modules." Derived by the loader from the module
    # list below. First-year cores need no twin spelling out here: the engine
    # aliases an equivalent pair into the passed set when it indexes the
    # transcript, so a mainstream twin satisfies the augmented code.
    prereqs:
      - {preceding_core: true}
  - code: ENCV4DS
    year: 5
    sem: 2
    prereqs:
      - {preceding_core: true}   # same gate as ENCV4DE
  - {code: ENCV4VW, year: 5, sem: 2, is_dp: true}
  - {code: "ELECTIVE_Y5S2", name: "Elective", credits: 16, year: 5, sem: 2, type: elective}
  - code: ENPD7CL
    year: 5
    sem: 2
    prereqs:
      - {min_year: 5}          # mainstream min_year 4 -> +1 for the 5-year degree
  

# ============================================================================
# OPEN DECISIONS — for academic sign-off (not resolved silently in code).
#
#   A1  RESOLVED: standalone programme (own file, own Level 2-4).
#
#   A1b Level 2-4 term placement follows the natural +1 mapping (mainstream
#       L2->Y3, L3->Y4, L4->Y5). The augmented Years 3-5 handbook was not
#       supplied; confirm the term-by-term layout. NOTE: `year` is cosmetic —
#       prereq CHECKING is unaffected — but three min_year floors were bumped +1
#       (ENCV3TT, ENPD7PP, ENPD7CL) to stay fail-safe on the 5-year calendar.
#
#   A1c RESOLVED: the Year-2 "Level 2 Programme-Specific Module" is ENSV2SE
#       (Surveying), pulled forward from Year 3. Named from the cohort — 96 of
#       153 augmented students sat ENSV2SE in this slot — and removed from
#       Year 3 to avoid double-listing. — Justin Pringle 2026-08-25
#       STILL OPEN: confirm the Year-2 elective/ZULN is not repeated in Year 3.
#
#   A2  Should the eight mainstream twins be catalogued as `substitute` modules?
#       Prereq checks read the transcript, so {any: [aug, main]} clears a
#       substituted student regardless. Cataloguing would silence the "not in
#       this programme" warnings and let credit totals recognise the twins.
#       Currently the twins live only in `equivalences` / the `_twins` anchors.
#
#   A3  Year-long placement (D1). MATH160/161, PHYS160/163 modelled at sem 2 for
#       credit-counting. Augmented Level 1 spans four semesters; confirm the
#       semester count that downstream min_sem / min_credits gates should use.
#
#   A4  1B carry rules (MATH161, PHYS163, MATH142) mirror mainstream (>=40 carry).
#       Confirm they apply unchanged to augmented.
#
#   A5  ENCV1EP "Engineering Practice Workshop" (0-cr DP, mainstream Year 1) does
#       not appear in the augmented handbook pages. Omitted here (module and
#       capstone gate). Confirm where it falls for augmented students.
# ============================================================================

# ── Ingest scope ──────────────────────────────────────────────────────────────
# The augmented ERS feed lists every engineering stream (Civil, Mech, Elec, ...).
# This programme keeps only students whose header carries a Civil stream code.
# A first-year still carrying two codes (e.g. ENCV ENME) is kept as Civil because
# ENCV is present — provisional, pending faculty rule. — Justin Pringle 2026-08-21
ingest:
  stream_codes: [ENCV]
