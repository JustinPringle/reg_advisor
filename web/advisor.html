<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civil Engineering — Registration Advisor</title>
<style>
  :root{
    --ink:#26261f; --muted:#6c6b64; --line:#e2e0d7; --bg:#faf9f5; --card:#ffffff;
    --green:#0f6e56; --green-bg:#e1f5ee; --amber:#854f0b; --amber-bg:#faeeda;
    --red:#a32d2d; --red-bg:#fcebeb; --gray:#5f5e5a; --gray-bg:#f1efe8;
    --blue:#185fa5; --blue-bg:#e6f1fb; --accent:#1d3a5f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.5}
  header{padding:12px 22px;border-bottom:1px solid var(--line);background:var(--card);
         display:flex;align-items:center;gap:14px}
  header h1{font-size:16px;font-weight:600;margin:0}
  header .sub{font-size:12px;color:var(--muted)}
  header .tag{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);
              border-radius:20px;padding:3px 10px}
  .modes{display:flex;gap:4px;margin-left:8px}
  .modebtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--muted);
           border-radius:8px;padding:4px 12px;cursor:pointer}
  .modebtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 50px)}
  aside{border-right:1px solid var(--line);background:var(--card);overflow-y:auto;padding:12px}
  aside input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px}
  .stu{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px}
  .stu:hover{background:var(--bg)} .stu.on{background:var(--blue-bg)}
  .stu .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stu .yr{font-size:11px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.green{background:var(--green)} .dot.orange{background:var(--amber)}
  .dot.red{background:var(--red)} .dot.exclude{background:#5b1010} .dot.unknown,.dot.none{background:#b8b6ad}
  .qhead{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 2px 6px}
  .qfilter{display:flex;gap:6px;margin-bottom:8px}
  .qfilter button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);
                  color:var(--muted);border-radius:20px;padding:2px 10px;cursor:pointer}
  .qfilter button.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
  .qrow{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid transparent}
  .qrow:hover{background:var(--bg)} .qrow.on{background:var(--blue-bg);border-color:var(--blue)}
  .qrow .top{display:flex;align-items:center;gap:8px}
  .qrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .qrow code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .qrow .why{color:var(--muted);font-size:12px;margin-top:2px}
  main{overflow-y:auto;padding:22px}
  .empty{color:var(--muted);font-size:14px;margin-top:40px;text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:22px}
  .kv{font-size:13px} .kv b{display:block;font-size:19px;font-weight:600} .kv span{color:var(--muted)}
  .name{font-size:20px;font-weight:600;margin:0 0 2px} .sn{color:var(--muted);font-size:13px;margin-bottom:14px}
  .badge{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:3px 11px}
  .b-green{background:var(--green-bg);color:var(--green)} .b-orange{background:var(--amber-bg);color:var(--amber)}
  .b-red{background:var(--red-bg);color:var(--red)} .b-exclude{background:#f2d5d5;color:#5b1010}
  .b-gray{background:var(--gray-bg);color:var(--gray)} .b-blue{background:var(--blue-bg);color:var(--blue)}
  .stand{display:flex;gap:28px;flex-wrap:wrap} .stand .col{min-width:210px}
  .stand .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
  .stand .note{font-size:12px;color:var(--muted);margin-top:6px}
  .flag{font-size:12px;padding:8px 11px;border-radius:8px;margin-top:12px}
  .flag.warn{background:var(--amber-bg);color:var(--amber)} .flag.ok{background:var(--green-bg);color:var(--green)}
  .bucket{margin-bottom:14px}
  .bucket .head{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .count{font-size:11px;font-weight:600;border-radius:20px;padding:1px 8px}
  .mod{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
  .mod:last-child{border-bottom:none}
  .mod code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);
            border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .mod .mn{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mod .cr{font-size:12px;color:var(--muted)}
  .grade{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--gray-bg);color:var(--gray)}
  .grade.pass{background:var(--green-bg);color:var(--green)}
  .carry{font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:1px 7px}
  .miss{font-size:12px;color:var(--red)}
  .qbtns{display:flex;gap:6px}
  .qbtns button{font:inherit;font-size:12px;border-radius:7px;padding:3px 10px;cursor:pointer;border:1px solid}
  .approve{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .escalate{background:var(--card);border-color:var(--line);color:var(--muted)}
  .decided{font-size:12px;font-weight:600;border-radius:20px;padding:2px 10px}
  .decided.approved{background:var(--green-bg);color:var(--green)}
  .decided.escalated{background:var(--amber-bg);color:var(--amber)}
  .builder label{display:flex;align-items:center;gap:10px;width:100%;cursor:pointer}
  .tally{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:14px}
  .tally .n{font-size:20px;font-weight:600} .tally .over{color:var(--red)}
  button.primary{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--accent);background:var(--accent);
         color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer}
  button.primary:disabled{opacity:.5;cursor:default}
  .verdict{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
  .v-CLEARED{color:var(--green);font-weight:600} .v-REVIEW{color:var(--amber);font-weight:600}
  .verdict .rz{color:var(--muted);flex:1}
</style>
</head>
<body>
<header>
  <h1>Civil Engineering — Registration Advisor</h1>
  <div class="modes">
    <button class="modebtn on" id="m-advisor" onclick="switchMode('advisor')">Advisor</button>
    <button class="modebtn" id="m-queue" onclick="switchMode('queue')">Concession queue</button>
  </div>
  <span class="tag">Local · POPIA-contained</span>
</header>

<div class="wrap">
  <aside id="side"></aside>
  <main id="main"><div class="empty">Pick a student to see their standing, grades, and advice.</div></main>
</div>

<script>
const $ = s => document.querySelector(s);
let MODE="advisor", STUDENTS=[], QUEUE=null, DEC={}, QFILTER="pending", CURRENT=null, DETAIL=null;
const BADGE={green:"b-green",orange:"b-orange",red:"b-red",exclude:"b-exclude",none:"b-gray",unknown:"b-gray"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R=x=>Math.round(x);
const key=(sn,code)=>sn+"|"+code;

async function boot(){
  STUDENTS = await (await fetch("/api/students")).json();
  renderSide();
}

function switchMode(m){
  MODE=m;
  $("#m-advisor").classList.toggle("on", m==="advisor");
  $("#m-queue").classList.toggle("on", m==="queue");
  renderSide();
}

async function renderSide(){
  if(MODE==="advisor"){ renderStudentList(""); return; }
  if(!QUEUE){
    const [q, dec] = await Promise.all([
      (await fetch("/api/triage")).json(),
      (await fetch("/api/decisions")).json()]);
    QUEUE=q; dec.forEach(d=>DEC[key(d.sn,d.code)]=d.decision);
  }
  renderQueue();
}

/* ---- advisor sidebar ---- */
function renderStudentList(q){
  const rows = STUDENTS.filter(s=>!q||s.name.toLowerCase().includes(q)||s.sn.includes(q));
  $("#side").innerHTML = `<input id="search" placeholder="Search name or student number…" autocomplete="off">
    <div id="list"></div>`;
  $("#search").value=q;
  $("#search").addEventListener("input", e=>{
    const v=e.target.value.trim().toLowerCase();
    $("#list").innerHTML = listHtml(STUDENTS.filter(s=>!v||s.name.toLowerCase().includes(v)||s.sn.includes(v)));
  });
  $("#list").innerHTML = listHtml(rows);
}
function listHtml(rows){
  return rows.map(s=>`<div class="stu ${s.sn===CURRENT?"on":""}" onclick="pick('${s.sn}')">
    <span class="dot ${s.official}" title="registrar: ${s.official}"></span>
    <span class="nm">${esc(s.name)||s.sn}</span>
    ${s.agree?"":'<span title="engine differs" style="color:#854f0b;font-size:12px">≠</span>'}
    <span class="yr">${s.year?("Y"+R(s.year)):""}</span></div>`).join("")
    || '<div class="empty">No match.</div>';
}

/* ---- queue sidebar (concessions to decide) ---- */
function pendingConcessions(){
  return (QUEUE.academic||[]).filter(r=>r.kind==="concession");
}
function renderQueue(){
  const all = pendingConcessions();
  const pending = all.filter(r=>!DEC[key(r.student_number,r.module_code)]);
  const show = QFILTER==="pending" ? pending : all;
  const autoN = (QUEUE.auto||[]).length;
  $("#side").innerHTML = `
    <div class="qhead">Concessions needing a decision</div>
    <div class="qfilter">
      <button class="${QFILTER==="pending"?"on":""}" onclick="setQFilter('pending')">Pending ${pending.length}</button>
      <button class="${QFILTER==="all"?"on":""}" onclick="setQFilter('all')">All ${all.length}</button>
    </div>
    <div id="qlist">${show.map(qrow).join("") || '<div class="empty">Nothing pending — queue clear.</div>'}</div>
    <div class="qhead" style="margin-top:16px">Auto-cleared to admin</div>
    <div style="font-size:12px;color:var(--muted);padding:0 2px">
      ${autoN} routine concession${autoN===1?"":"s"} cleared under the auto-rule — already on the admin worklist.</div>`;
}
function qrow(r){
  const d = DEC[key(r.student_number,r.module_code)];
  const tag = d?`<span class="decided ${d}">${d}</span>`:`<span class="badge b-orange">${r.score}</span>`;
  return `<div class="qrow ${CURRENT===r.student_number?"on":""}" onclick="pick('${r.student_number}')">
    <div class="top"><span class="nm">${esc(r.name)||r.student_number}</span>
      <code>${esc(r.module_code)}</code>${tag}</div>
    <div class="why">${esc(r.reason)}</div></div>`;
}
function setQFilter(f){ QFILTER=f; renderQueue(); }

/* ---- detail ---- */
async function pick(sn){
  CURRENT=sn; renderSide();
  DETAIL = await (await fetch("/api/students/"+sn)).json();
  render();
}

function gradePill(m, passed){
  if(m.mark==null) return "";
  return `<span class="grade ${passed?"pass":""}" title="best mark">${R(m.mark)}</span>`;
}
function carryPill(m){
  const c=(m.prereq_marks||[]).filter(p=>p.mark!=null).map(p=>`${esc(p.code)} ${R(p.mark)}`).join(", ");
  return c?`<span class="carry" title="mark carried in the prerequisite">carried ${c}</span>`:"";
}
function decideBtns(m){
  const d = DEC[key(CURRENT,m.code)];
  if(d) return `<span class="decided ${d}">${d}</span>`;
  return `<span class="qbtns">
    <button class="approve" onclick="decide('${m.code}','approved')">Approve</button>
    <button class="escalate" onclick="decide('${m.code}','escalated')">Escalate</button></span>`;
}
function modLine(m, opts){
  const miss=(opts.withMiss&&m.unmet&&m.unmet.length)?`<span class="miss">needs ${m.unmet.map(esc).join(", ")}</span>`:"";
  const tail = opts.decide ? decideBtns(m) : `<span class="cr">${m.credits||0}cr</span>`;
  return `<div class="mod"><code>${esc(m.code)}</code><span class="mn">${esc(m.name)}</span>
    ${opts.concession?carryPill(m):""}${miss}${gradePill(m,opts.passed)}${tail}</div>`;
}
function bucket(title,k,cls,opts){
  const rows=DETAIL.advice[k]||[]; if(!rows.length) return "";
  return `<div class="bucket"><div class="head">${title}
    <span class="count ${cls}">${rows.length}</span></div>
    ${rows.map(m=>modLine(m,opts)).join("")}</div>`;
}

async function decide(code, decision){
  await fetch("/api/decide",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({sn:CURRENT, code, decision})});
  DEC[key(CURRENT,code)]=decision;
  render(); if(MODE==="queue") renderQueue();
}

function render(){
  const d=DETAIL,b=d.bio,off=d.official,en=d.engine;
  const cap=d.cap==null?"no cap":(d.cap+" cr");
  const agree=d.agree?`<div class="flag ok">Registrar and engine agree on standing.</div>`
    :`<div class="flag warn">Engine re-derivation differs from the registrar
       (${esc(en.status)} vs ${esc(off.status)}). The registrar's code stands;
       the engine is indicative pending policy sign-off.</div>`;
  $("#main").innerHTML=`
  <div class="card">
    <div class="name">${esc(b.surname)}, ${esc(b.name)}</div>
    <div class="sn">${esc(b.sn)} · Year ${b.year_of_study?R(b.year_of_study):"—"}</div>
    <div class="row">
      <div class="kv"><b>${b.gpa}</b><span>average mark</span></div>
      <div class="kv"><b>${b.credits_passed}</b><span>credits passed</span></div>
      <div class="kv"><b>${b.passed_count}</b><span>modules passed</span></div>
      <div class="kv"><b>${b.semesters}</b><span>semesters</span></div>
      <div class="kv"><b>${cap}</b><span>credit cap this term</span></div>
    </div>
    ${b.in_progress&&b.in_progress.length?`<div style="margin-top:12px;font-size:13px">
      <span style="color:var(--muted)">Currently registered:</span>
      ${b.in_progress.map(c=>`<code style="margin:0 3px">${esc(c)}</code>`).join("")}</div>`:""}
  </div>

  <div class="card"><h2>Academic standing</h2>
    <div class="stand">
      <div class="col"><div class="lbl">Registrar (authoritative)</div>
        <span class="badge ${BADGE[off.status]}">${esc(off.code||"—")} · ${esc(off.status)}</span>
        <div class="note">${esc(off.text||"No intervention proposed — continuing.")}</div></div>
      <div class="col"><div class="lbl">Engine cross-check</div>
        <span class="badge ${BADGE[en.status]}">${esc(en.status)}</span>
        <div class="note">cumulative ${en.cumulative_pct}% · latest semester
          ${en.semester_pct}% (${esc(en.period)})</div></div>
    </div>${agree}
  </div>

  <div class="card"><h2>Concessions ${DETAIL.advice.concession_possible.length?"":"· none"}</h2>
    ${DETAIL.advice.concession_possible.length
      ? `<p style="font-size:13px;color:var(--muted);margin:0 0 10px">
          Near-misses: average ≥ 55, one requirement short, prerequisite carried above 45.
          Approve to send to admin, or escalate.</p>
        ${bucket("","concession_possible","b-orange",{withMiss:true,concession:true,decide:true})}`
      : `<p style="font-size:13px;color:var(--muted);margin:0">No concession applies — this student
          meets every prerequisite outright or falls short of the carry rule.</p>`}
  </div>

  <div class="card"><h2>Advice &amp; grades</h2>
    ${bucket("Can register","can_register","b-green",{})}
    ${bucket("Blocked","cannot_register","b-red",{withMiss:true})}
    ${bucket("Needs review","needs_review","b-blue",{withMiss:true})}
    ${bucket("Already passed","passed","b-gray",{passed:true})}
  </div>`;
}
boot();
</script>
</body>
</html>
